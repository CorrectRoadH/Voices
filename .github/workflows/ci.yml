name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: voices
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: voices_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voices -d voices_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://voices:test-only-password@127.0.0.1:5432/voices_test?sslmode=disable
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check workflow syntax
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          version: '1.3.0'
          run-install: false
          cache: true
          cache-dependency-path: |
            web/pnpm-lock.yaml
            update-worker/pnpm-lock.yaml
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: vp -C web install --frozen-lockfile
      - run: vp -C update-worker install --frozen-lockfile
      - run: vp -C web exec e2e-web install chromium --with-deps
      - run: vp run check
      - name: Verify generated API types
        run: |
          vp -C web run generate:api
          git diff --exit-code -- web/src/lib/api.generated.ts
      - name: e2e 真实应用浏览器验收
        run: vp run test:e2e
        env:
          E2E_MODEL: ${{ vars.E2E_MODEL }}
          E2E_MODEL_BASE_URL: ${{ vars.E2E_MODEL_BASE_URL }}
          E2E_MODEL_API_KEY: ${{ secrets.E2E_MODEL_API_KEY }}
      - run: vp run test:worker:runtime
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-traces
          path: web/.e2e
          include-hidden-files: true
          if-no-files-found: ignore
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: voices:ci
          build-args: VOICES_VERSION=0.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: test "$(docker run --rm voices:ci version)" = '0.0.0'
