name: CI
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**'
      - '!README*'
      - '!docs/**'
      - '!memory/**'
      - '!**/*.md'
      - 'docs/api/**'
      - 'docs/release-package.txt'
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
    secrets:
      E2E_MODEL_BASE_URL:
        required: true
      TS_AUTHKEY:
        required: true
      E2E_MODEL_API_KEY:
        required: true
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.paths.outputs.required }}
    steps:
      - uses: actions/checkout@v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            python3 .github/scripts/ci-paths.py "$BASE_SHA" "$HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            echo 'required=true' >> "$GITHUB_OUTPUT"
          fi
  test:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    name: test (${{ matrix.suite }}${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: checks
            shard: ''
            e2e_filter: ''
          - suite: browser
            shard: '-reading'
            e2e_filter: '^(TestTranscriptChatBrowser|TestBrowserFullStack|TestTranscriptNavigationBrowser|TestLoadingBrowser)$'
          - suite: browser
            shard: '-accounts'
            e2e_filter: '^(TestAccountsBrowserFullStack|TestLLMModelsBrowser|TestVoiceprintBrowser)$'
          - suite: browser
            shard: '-settings'
            e2e_filter: '^(TestServerSettingsBrowser|TestOnboardingBrowser|TestOnboardingRevisionBrowser|TestInteractionBrowser|TestAccountFiltersBrowser)$'
          - suite: browser
            shard: '-insights'
            e2e_filter: '^(TestAutomaticInsightsBrowser|TestAdministrationInsightsBrowser|TestJobRecoveryBrowser|TestOnboardingSkipBrowser|TestTranscriptSearchBrowser)$'
          - suite: browser
            shard: '-language'
            e2e_filter: '^(TestInterfaceLanguageBrowser|TestAdministrationBrowser|TestUpdatesBrowser)$'
          - suite: browser
            shard: '-references'
            e2e_filter: '^(TestReferencesBrowser|TestCallLogsBrowser|TestOIDCBrowser)$'
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: voices
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: voices_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voices -d voices_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://voices:test-only-password@127.0.0.1:5432/voices_test?sslmode=disable
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      # Release may test an older tag; network/privacy helpers belong to this
      # workflow revision, not to the historical application checkout.
      - name: Checkout CI support
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-support
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Refuse untrusted browser execution
        if: matrix.suite == 'browser' && github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]')
        run: |
          echo '::error::Browser acceptance requires a trusted repository event.'
          exit 1
      - name: Require browser model configuration
        id: model-config
        if: matrix.suite == 'browser'
        env:
          E2E_MODEL: ${{ vars.E2E_MODEL }}
          E2E_MODEL_BASE_URL: ${{ secrets.E2E_MODEL_BASE_URL }}
          E2E_MODEL_API_KEY: ${{ secrets.E2E_MODEL_API_KEY }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          for name in E2E_MODEL E2E_MODEL_BASE_URL E2E_MODEL_API_KEY TS_AUTHKEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name for browser acceptance"
              exit 1
            fi
          done
          node .ci-support/.github/scripts/model-privacy.mjs mask
      - name: Connect model network
        id: tailnet
        if: matrix.suite == 'browser'
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --accept-dns=false
          log-mode: quiet
      - name: Disable subnet routes
        if: matrix.suite == 'browser'
        run: |
          if ! sudo tailscale set --accept-routes=false > /dev/null 2>&1; then
            echo '::error::Could not disable model network subnet routes.'
            exit 1
          fi
      - name: Check model connectivity
        if: matrix.suite == 'browser'
        env:
          E2E_MODEL_BASE_URL: ${{ secrets.E2E_MODEL_BASE_URL }}
        run: node .ci-support/.github/scripts/model-connectivity.mjs
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Check workflow syntax
        if: matrix.suite == 'checks'
        run: |
          bash .ci-support/.github/scripts/install-actionlint.sh
          "$RUNNER_TEMP/actionlint/actionlint"
          node --test .ci-support/.github/scripts/model-privacy.test.mjs
          python3 .ci-support/.github/scripts/ci-paths.test.py
          python3 .ci-support/.github/scripts/e2e-timings.test.py
          python3 scripts/check-e2e-shards.py
      - name: Identify dependency cache
        id: dependency-cache
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          if [ "$SUITE" = checks ]; then
            # setup-vp accepts one file, not a glob or a multiline path list.
            # This file selects the cache only; installs use the real lockfiles.
            sha256sum web/pnpm-lock.yaml update-worker/pnpm-lock.yaml > .ci-pnpm-lock.yaml
            echo 'path=.ci-pnpm-lock.yaml' >> "$GITHUB_OUTPUT"
          else
            echo 'path=web/pnpm-lock.yaml' >> "$GITHUB_OUTPUT"
          fi
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          version: '1.3.0'
          run-install: false
          cache: true
          cache-dependency-path: ${{ steps.dependency-cache.outputs.path }}
      - name: Identify APT cache
        id: apt-key
        env:
          SUITE: ${{ matrix.suite }}
          LOCK_HASH: ${{ hashFiles('web/pnpm-lock.yaml', 'update-worker/pnpm-lock.yaml') }}
        run: echo "key=apt-v1-$ImageOS-$ImageVersion-$(uname -m)-$SUITE-$LOCK_HASH" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v6.1.0
        id: apt-cache
        with:
          path: ~/.cache/voices-apt/*.deb
          key: ${{ steps.apt-key.outputs.key }}
      - name: Configure APT downloads
        run: |
          mkdir -p "$HOME/.cache/voices-apt"
          sudo tee /etc/apt/apt.conf.d/99voices-ci > /dev/null <<EOF
          Dir::Cache::archives "$HOME/.cache/voices-apt";
          APT::Keep-Downloaded-Packages "true";
          Binary::apt::APT::Keep-Downloaded-Packages "true";
          APT::Install-Recommends "false";
          Acquire::Retries "3";
          EOF
          sudo find /etc/apt/sources.list.d -type f \( -name '*.sources' -o -name '*.list' \) \
            -exec sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' {} +
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list
          fi
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
      - name: Install media dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: vp -C web install --frozen-lockfile
      - run: vp -C update-worker install --frozen-lockfile
        if: matrix.suite == 'checks'
      - uses: actions/cache/restore@v6.1.0
        if: matrix.suite == 'browser'
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - run: vp -C web exec e2e-web install chromium --with-deps
        if: matrix.suite == 'browser'
      - uses: actions/cache/save@v6.1.0
        if: steps.apt-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/voices-apt/*.deb
          key: ${{ steps.apt-key.outputs.key }}
      - uses: actions/cache/save@v6.1.0
        if: matrix.suite == 'browser' && steps.browser-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browser-cache.outputs.cache-primary-key }}
      - run: vp run check
        if: matrix.suite == 'checks'
      - name: Verify generated API types
        if: matrix.suite == 'checks'
        run: |
          vp -C web run generate:api
          git diff --exit-code -- web/src/lib/api.generated.ts
      - name: e2e 真实应用浏览器验收
        id: acceptance
        if: matrix.suite == 'browser'
        run: vp run test:e2e -run "$E2E_FILTER"
        env:
          E2E_FILTER: ${{ matrix.e2e_filter }}
          E2E_MODEL: ${{ vars.E2E_MODEL }}
          E2E_MODEL_BASE_URL: ${{ secrets.E2E_MODEL_BASE_URL }}
          E2E_MODEL_API_KEY: ${{ secrets.E2E_MODEL_API_KEY }}
      - name: Summarize E2E timings
        id: timings
        if: always() && matrix.suite == 'browser' && (steps.acceptance.outcome == 'success' || steps.acceptance.outcome == 'failure')
        run: python3 .ci-support/.github/scripts/e2e-timings.py web/.e2e > "$RUNNER_TEMP/e2e-timings.json"
      - uses: actions/upload-artifact@v7.0.2
        if: always() && matrix.suite == 'browser' && steps.timings.outcome == 'success'
        with:
          name: e2e-timings${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e-timings.json
          retention-days: 7
          if-no-files-found: error
      - run: vp run test:worker:runtime
        if: matrix.suite == 'checks'
      - name: Prepare private failure report
        id: redact
        if: failure() && matrix.suite == 'browser' && steps.model-config.outcome == 'success'
        env:
          E2E_MODEL_BASE_URL: ${{ secrets.E2E_MODEL_BASE_URL }}
          E2E_MODEL_API_KEY: ${{ secrets.E2E_MODEL_API_KEY }}
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          ARTIFACT_SOURCE: web/.e2e
          ARTIFACT_SAFE: ${{ runner.temp }}/voices-e2e-safe
        run: node .ci-support/.github/scripts/model-privacy.mjs artifacts
      - uses: actions/upload-artifact@v7.0.2
        if: failure() && matrix.suite == 'browser' && steps.redact.outcome == 'success'
        with:
          name: browser-failure-traces${{ matrix.shard }}
          path: ${{ runner.temp }}/voices-e2e-safe
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Disconnect model network
        if: always() && steps.tailnet.outcome == 'success'
        run: |
          if ! sudo tailscale logout > /dev/null 2>&1; then
            echo '::error::Model network logout failed.'
            exit 1
          fi
          echo 'Model network logged out.'
  docker:
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: voices:ci
          build-args: VOICES_VERSION=0.0.0
          cache-from: type=gha,scope=ci-image-${{ runner.arch }}
          cache-to: type=gha,scope=ci-image-${{ runner.arch }},mode=max
      - run: test "$(docker run --rm voices:ci version)" = '0.0.0'
  required:
    name: CI required
    if: always()
    needs: [changes, test, docker]
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_REQUIRED: ${{ needs.changes.outputs.required }}
          TEST_RESULT: ${{ needs.test.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$RUN_REQUIRED" = false ]; then
            test "$TEST_RESULT" = skipped
            test "$DOCKER_RESULT" = skipped
          else
            test "$RUN_REQUIRED" = true
            test "$TEST_RESULT" = success
            test "$DOCKER_RESULT" = success
          fi
