name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable or nightly tag to publish
        required: true
        type: string
      nightly:
        description: Report this run as a Nightly release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
      nightly: ${{ steps.target.outputs.nightly }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve release tag
        id: target
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          REPORT_NIGHTLY: ${{ inputs.nightly == true }}
        run: |
          version_pattern='v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          if [[ "$RELEASE_TAG" =~ ^${version_pattern}$ ]]; then
            nightly=false
          elif [[ "$RELEASE_TAG" =~ ^${version_pattern}-nightly\.[1-9][0-9]*$ ]]; then
            nightly=true
          else
            echo "::error::Expected a stable or nightly version tag"
            exit 1
          fi
          if [[ "$REPORT_NIGHTLY" == true && "$nightly" != true ]]; then
            echo "::error::Nightly dispatch requires a nightly tag"
            exit 1
          fi
          sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          {
            echo "tag=$RELEASE_TAG"
            echo "sha=$sha"
            echo "nightly=$nightly"
          } >> "$GITHUB_OUTPUT"
  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
    secrets:
      E2E_MODEL_BASE_URL: ${{ secrets.E2E_MODEL_BASE_URL }}
      TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      E2E_MODEL_API_KEY: ${{ secrets.E2E_MODEL_API_KEY }}
  image:
    needs: [validate, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Prevent latest version regression
        if: needs.validate.outputs.nightly == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          IMAGE: correctroad/voices
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[]' | jq -s . > "$RUNNER_TEMP/releases.json"
          if docker pull "$IMAGE:latest" 2> "$RUNNER_TEMP/image-error"; then
            current=$(docker image inspect "$IMAGE:latest" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')
            python3 scripts/check-release.py "$RELEASE_TAG" "$RUNNER_TEMP/releases.json" "$current"
          else
            status=$(curl --silent --show-error --output "$RUNNER_TEMP/latest-tag.json" --write-out '%{http_code}' \
              https://hub.docker.com/v2/repositories/correctroad/voices/tags/latest)
            if [ "$status" = 404 ]; then
              python3 scripts/check-release.py "$RELEASE_TAG" "$RUNNER_TEMP/releases.json"
            else
              echo "Cannot verify latest image (Docker Hub HTTP $status)" >&2
              exit 1
            fi
          fi
      - uses: docker/metadata-action@v6.2.0
        id: meta
        with:
          images: correctroad/voices
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.tag }}
            org.opencontainers.image.revision=${{ needs.validate.outputs.sha }}
          flavor: latest=${{ needs.validate.outputs.nightly == 'true' && 'false' || 'auto' }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.validate.outputs.tag }},enable=${{ needs.validate.outputs.nightly == 'false' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.validate.outputs.tag }},enable=${{ needs.validate.outputs.nightly == 'false' }}
            type=raw,value=${{ needs.validate.outputs.sha }},enable=${{ needs.validate.outputs.nightly == 'false' }}
            type=raw,value=latest,enable=${{ needs.validate.outputs.nightly == 'false' }}
            type=raw,value=${{ needs.validate.outputs.tag }},enable=${{ needs.validate.outputs.nightly == 'true' }}
            type=raw,value=nightly,enable=${{ needs.validate.outputs.nightly == 'true' }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VOICES_VERSION=${{ needs.validate.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  binary:
    needs: [validate, ci]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build verified native release package
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: package
          outputs: type=local,dest=release-package
          build-args: VOICES_VERSION=${{ needs.validate.outputs.tag }}
          cache-from: type=gha,scope=binary-${{ matrix.arch }}
          cache-to: type=gha,scope=binary-${{ matrix.arch }},mode=max
      - name: Package
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: tar -C release-package -czf "voices-linux-$RELEASE_ARCH.tar.gz" voices web lib licenses README.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: binary-${{ matrix.arch }}
          path: voices-linux-${{ matrix.arch }}.tar.gz
          retention-days: 1
          if-no-files-found: error
  release:
    needs: [validate, image, binary]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true
      - name: Verify and checksum release assets
        working-directory: release-assets
        run: |
          test -s voices-linux-amd64.tar.gz
          test -s voices-linux-arm64.tar.gz
          sha256sum voices-linux-amd64.tar.gz voices-linux-arm64.tar.gz > SHA256SUMS
      - name: Generate release notes
        env:
          GIT_CLIFF_TAG_PATTERN: ${{ needs.validate.outputs.nightly == 'false' && '^v[0-9]+[.][0-9]+[.][0-9]+$' || '^v[0-9]+[.][0-9]+[.][0-9]+(-nightly[.][0-9]+)?$' }}
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: notes
        with:
          config: cliff.toml
          args: --latest --strip header
      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          body: ${{ steps.notes.outputs.content }}
          prerelease: ${{ needs.validate.outputs.nightly == 'true' }}
          make_latest: ${{ needs.validate.outputs.nightly == 'true' && 'false' || '' }}
          fail_on_unmatched_files: true
          files: |
            release-assets/voices-linux-amd64.tar.gz
            release-assets/voices-linux-arm64.tar.gz
            release-assets/SHA256SUMS
  report:
    needs: [validate, ci, image, binary, release]
    if: >-
      ${{ always() && inputs.nightly &&
      (contains(needs.*.result, 'failure') || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Report Nightly result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || needs.release.result }}
        run: |
          title='Nightly release failing'
          matches="$(gh api --paginate "repos/$GH_REPO/issues?state=open&per_page=100" \
            --jq '.[] | select(.pull_request == null and .title == "Nightly release failing") | .number')"
          issue="${matches%%$'\n'*}"
          if [[ "$RESULT" == failure ]]; then
            if [[ -n "$issue" ]]; then
              gh issue comment "$issue" --body "Nightly release failed: $RUN_URL"
            else
              gh issue create --title "$title" --body "Nightly release failed: $RUN_URL"
            fi
          elif [[ "$RESULT" == success && -n "$issue" ]]; then
            gh issue close "$issue" --comment "Nightly release succeeded: $RUN_URL"
          fi
