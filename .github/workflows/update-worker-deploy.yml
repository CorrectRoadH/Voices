name: Deploy update worker
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-worker-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: update-worker-production
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: '24'
          version: '1.3.0'
          run-install: false
          cache: true
          cache-dependency-path: update-worker/pnpm-lock.yaml
      - run: vp -C update-worker install --frozen-lockfile
      - run: vp -C update-worker run check
      - run: vp -C update-worker run test
      - run: vp -C update-worker run test:runtime
      - run: vp -C update-worker run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
