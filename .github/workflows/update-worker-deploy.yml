name: Deploy update worker
on:
  push:
    branches: [main]
    paths:
      - "update-worker/**"
      - "!update-worker/README.md"
      - ".github/workflows/update-worker-deploy.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: update-worker-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: update-worker-production
    steps:
      - name: Require Sentry upload credential
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "::error::Configure SENTRY_AUTH_TOKEN before publishing production assets"
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          version: '1.7.0'
          run-install: false
          cache: true
          cache-dependency-path: update-worker/pnpm-lock.yaml
      - run: vp -C update-worker install --frozen-lockfile
      - run: vp -C update-worker run check
      - run: vp -C update-worker run test
      - run: vp -C update-worker run test:runtime
        if: github.event_name == 'workflow_dispatch'
      - run: vp -C update-worker run deploy
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_RELEASE: update@${{ github.sha }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
