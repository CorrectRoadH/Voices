root = "."
tmp_dir = ".air"
env_files = [".env"]

[build]
cmd = "CGO_ENABLED=0 go build -o ./.air/voices ./cmd/voices"
entrypoint = ["./.air/voices"]
include_ext = ["go", "sql"]
exclude_dir = [".air", ".git", "web", "node_modules"]
delay = 500
send_interrupt = true
kill_delay = "20s"
stop_on_error = true

[log]
time = true

[misc]
clean_on_exit = true
