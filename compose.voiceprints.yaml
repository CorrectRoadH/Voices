# Compatibility overlay; compose.yaml already includes this service by default.
services:
  app:
    environment:
      VOICEPRINT_URL: ${VOICEPRINT_URL-http://voiceprints:8091}
    depends_on:
      voiceprints:
        condition: service_healthy
  voiceprints:
    build: ./voiceprint-service
    read_only: true
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
